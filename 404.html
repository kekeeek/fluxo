<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fluxo — Redirection</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<script>
  // GitHub Pages serves this file for any URL that doesn't match a real file,
  // which is what makes /r/<code> style links work without a backend.
  //
  // We take the last non-empty path segment as the gofile content code and
  // redirect straight to the real gofile download page. No database, no
  // server: the destination is encoded entirely in the URL itself.
  (function () {
    var segments = window.location.pathname.split('/').filter(Boolean);
    var code = segments[segments.length - 1];

    var isLikelyCode = code && /^[A-Za-z0-9_-]{4,}$/.test(code) && code !== '404.html';

    if (isLikelyCode) {
      window.location.replace('https://gofile.io/d/' + code);
    } else {
      document.getElementById('fallback').style.display = 'block';
    }
  })();
</script>
</head>
<body>
  <main class="redirect-page">
    <div class="brand">
      <span class="brand-mark"></span>
      <span class="brand-name">Fluxo</span>
    </div>
    <p class="redirect-text">Redirection vers ton fichier…</p>
    <div id="fallback" style="display:none;">
      <p class="redirect-text">Page introuvable. <a href="/fluxo/">Retour à l'accueil</a>.</p>
    </div>
  </main>
</body>
</html>
